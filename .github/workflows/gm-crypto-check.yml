name: GM Crypto CI

on:
  push:
    # fix/** is included so a fix branch gets CI before its pull request exists.
    branches: [main, "feature/**", "chore/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: CI only reads repository contents.
permissions:
  contents: read

concurrency:
  group: gm-crypto-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pin third-party actions to immutable commit SHAs.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Needs the production build, so it runs after it.
      - name: Bootstrap password gate (end-to-end)
        run: npm run test:api
